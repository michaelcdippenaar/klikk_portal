name: klikk-financials-v2-development

services:
  frontend-v2:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: klikk-financials-v2-dev
    restart: unless-stopped
    init: true
    environment:
      VITE_API_BASE_URL: /backend
      KLIKK_BACKEND_ORIGIN: ${KLIKK_BACKEND_ORIGIN:-https://console.8-bit.space}
      KLIKK_DEV_PUBLIC_KEY_FILE: /run/secrets/klikk_developer_public_key
    ports:
      - "${KLIKK_DEV_HTTP_BIND:-127.0.0.1}:${KLIKK_DEV_HTTP_PORT:-4173}:4173"
      - "${KLIKK_DEV_SSH_BIND:-127.0.0.1}:${KLIKK_DEV_SSH_PORT:-2222}:22"
    volumes:
      - .:/workspace
      - klikk-v2-node-modules:/workspace/node_modules
      - klikk-v2-ssh-host-keys:/var/lib/klikk-sshd
      - type: bind
        source: ${KLIKK_DEV_PUBLIC_KEY:?Set KLIKK_DEV_PUBLIC_KEY to an absolute public-key or authorized_keys file}
        target: /run/secrets/klikk_developer_public_key
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null && ssh-keyscan -T 3 -p 22 127.0.0.1 >/dev/null 2>&1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  klikk-v2-node-modules:
  klikk-v2-ssh-host-keys:
